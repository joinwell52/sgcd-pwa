<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

        const getPie3D = (pieData, internalDiameterRatio, distance, alpha, pieHeight, opacity = 1) => {
            const series = [];
            let sumValue = 0;
            let startValue = 0;
            let endValue = 0;
            let legendData = [];
            let legendBfb = [];
            const k = 1 - internalDiameterRatio;
            pieData.sort((a, b) => b.value - a.value);
            for (let i = 0; i < pieData.length; i++) {
                sumValue += pieData[i].value;
                const seriesItem = {
                    name: typeof pieData[i].name === 'undefined' ? `series${i}` : pieData[i].name,
                    type: 'surface',
                    parametric: true,
                    wireframe: { show: false },
                    pieData: pieData[i],
                    pieStatus: { selected: false, hovered: false, k: k },
                    center: ['50%', '50%'],
                    label: {
                        show: true,
                        position: 'outside',
                        formatter: function(params) {
                            const data = params.data;
                            const percent = ((data.endRatio - data.startRatio) * 100).toFixed(1);
                            return `${data.name}\n${data.value} (${percent}%)`;
                        },
                        color: '#333',
                        fontSize: 18,
                        fontWeight: 'bold',
                        backgroundColor: 'rgba(255, 255, 255, 0.95)',
                        padding: [8, 10],
                        borderRadius: 6,
                        borderColor: '#666',
                        borderWidth: 1.5,
                        distance: 30
                    },
                    labelLine: {
                        show: true,
                        length: 20,
                        length2: 30,
                        lineStyle: { width: 2.5, color: '#555' }
                    }
                };
                if (typeof pieData[i].itemStyle !== 'undefined') {
                    const itemStyle = {};
                    itemStyle.color = typeof pieData[i].itemStyle.color !== 'undefined' ? pieData[i].itemStyle.color : opacity;
                    itemStyle.opacity = typeof pieData[i].itemStyle.opacity !== 'undefined' ? pieData[i].itemStyle.opacity : opacity;
                    seriesItem.itemStyle = itemStyle;
                }
                series.push(seriesItem);
            }
            legendData = [];
            legendBfb = [];
            for (let i = 0; i < series.length; i++) {
                endValue = startValue + series[i].pieData.value;
                series[i].pieData.startRatio = startValue / sumValue;
                series[i].pieData.endRatio = endValue / sumValue;
                series[i].parametricEquation = getParametricEquation(
                    series[i].pieData.startRatio,
                    series[i].pieData.endRatio,
                    false,
                    false,
                    k,
                    series[i].pieData.value
                );
                startValue = endValue;
                const bfb = fomatFloat(series[i].pieData.value / sumValue, 4);
                legendData.push({ name: series[i].name, value: bfb });
                legendBfb.push({ name: series[i].name, value: bfb });
            }
            const boxHeight = getHeight3D(series, pieHeight);
            const option = {
                legend: {
                    show: true,
                    position: 'bottom',
                    orient: 'horizontal',
                    bottom: 10,
                    itemGap: 10,
                    textStyle: {
                        color: document.body.classList.contains('light-theme') ? '#1a2a44' : '#e6f0fa',
                        fontSize: 12
                    },
                    icon: 'circle'
                },
                tooltip: {
                    backgroundColor: 'rgba(59, 130, 246, 0.9)',
                    borderRadius: 8,
                    textStyle: { color: '#fff', fontSize: 12 },
                    formatter: params => {
                        if (params.seriesName !== 'mouseoutSeries' && params.seriesName !== 'pie2d') {
                            const bfb = ((option.series[params.seriesIndex].pieData.endRatio -
                                option.series[params.seriesIndex].pieData.startRatio) * 100).toFixed(2);
                            return `${params.seriesName}<br/><span style="display:inline-block;margin-right:5px;border-radius:10px;width:10px;height:10px;background-color:${params.color};"></span>${bfb}%`;
                        }
                    }
                },
                xAxis3D: { min: -1, max: 1 },
                yAxis3D: { min: -1, max: 1 },
                zAxis3D: { min: -1, max: 1 },
                grid3D: {
                    show: false,
                    boxHeight: boxHeight,
                    viewControl: {
                        alpha,
                        distance,
                        rotateSensitivity: 1,
                        zoomSensitivity: 1,
                        panSensitivity: 0,
                        autoRotate: true,
                        center: [0, -20, 0]
                    }
                },
                series: series
            };
            return option;
        };
        const getParametricEquation = (startRatio, endRatio, isSelected, isHovered, k, h) => {
            const midRatio = (startRatio + endRatio) / 2;
            const startRadian = startRatio * Math.PI * 2;
            const endRadian = endRatio * Math.PI * 2;
            const midRadian = midRatio * Math.PI * 2;
            if (startRatio === 0 && endRatio === 1) {
                isSelected = false;
            }
            k = typeof k !== 'undefined' ? k : 1 / 3;
            const offsetX = isSelected ? Math.cos(midRadian) * 0.1 : 0;
            const offsetY = isSelected ? Math.sin(midRadian) * 0.1 : 0;
            const hoverRate = isHovered ? 1.05 : 1;
            return {
                u: { min: -Math.PI, max: Math.PI * 3, step: Math.PI / 32 },
                v: { min: 0, max: Math.PI * 2, step: Math.PI / 20 },
                x: function(u, v) {
                    if (u < startRadian) {
                        return offsetX + Math.cos(startRadian) * (1 + Math.cos(v) * k) * hoverRate;
                    }
                    if (u > endRadian) {
                        return offsetX + Math.cos(endRadian) * (1 + Math.cos(v) * k) * hoverRate;
                    }
                    return offsetX + Math.cos(u) * (1 + Math.cos(v) * k) * hoverRate;
                },
                y: function(u, v) {
                    if (u < startRadian) {
                        return offsetY + Math.sin(startRadian) * (1 + Math.cos(v) * k) * hoverRate;
                    }
                    if (u > endRadian) {
                        return offsetY + Math.sin(endRadian) * (1 + Math.cos(v) * k) * hoverRate;
                    }
                    return offsetY + Math.sin(u) * (1 + Math.cos(v) * k) * hoverRate;
                },
                z: function(u, v) {
                    if (u < -Math.PI * 0.5) {
                        return Math.sin(u);
                    }
                    if (u > Math.PI * 2.5) {
                        return Math.sin(u) * h * 0.1;
                    }
                    return Math.sin(v) > 0 ? 1 * h * 0.1 : -1;
                }
            };
        };
        const getHeight3D = (series, height) => {
            series.sort((a, b) => b.pieData.value - a.pieData.value);
            return (height * 25) / series[0].pieData.value;
        };
        const fomatFloat = (num, n) => {
            let f = parseFloat(num);
            if (isNaN(f)) {
                return false;
            }
            f = Math.round(num * Math.pow(10, n)) / Math.pow(10, n);
            let s = f.toString();
            let rs = s.indexOf('.');
            if (rs < 0) {
                rs = s.length;
                s += '.';
            }
            while (s.length <= rs + n) {
                s += '0';
            }
            return s;
        };
        const body = document.body;

                            { name: '融租', value: 490, itemStyle: { color: '#00FFFF' } },
                            { name: '挂靠', value: 75, itemStyle: { color: '#9370DB' } },
                            { name: '库存', value: 28, itemStyle: { color: '#FFA500' } }
                        ];
                    } else if (type === 'customer') {
                        return [
                            { name: '营运中司机', value: 820, itemStyle: { color: '#00CED1' } },
                            { name: '非营运司机', value: 46, itemStyle: { color: '#FFA500' } }
                        ];
                    } else {
                        return [
                            { name: '经租合同', value: 230, itemStyle: { color: '#40E0D0' } },
                            { name: '融租合同', value: 490, itemStyle: { color: '#00FFFF' } },
                            { name: '服务合同', value: 36, itemStyle: { color: '#9370DB' } }
                        ];
                    }
                };
                const adjustParamsByWindowSize = () => {
                    const width = window.innerWidth;
                    let distance = 180;
                    let pieHeight = 12;
                    if (width < 768) {
                        distance = 200;
                        pieHeight = 12;
                    } else if (width < 1024) {
                        distance = 180;
                        pieHeight = 11;
                    }
                    return { distance, pieHeight };
                };
                window.updateChart = function(type) {
                    try {
                        const chartTitle = document.getElementById('chart-title');
                        const metricItems = document.querySelectorAll('.metric-item');
                        metricItems.forEach(item => item.classList.remove('active'));
                        const pieData = getChartData(type);
                        const { distance, pieHeight } = adjustParamsByWindowSize();
                        if (type === 'vehicle') {
                            chartTitle.innerHTML = '<i class="fas fa-chart-pie"></i> 车辆分布';
                            document.querySelector('.metric-item[data-type="vehicle"]').classList.add('active');
                        } else if (type === 'customer') {
                            chartTitle.innerHTML = '<i class="fas fa-chart-pie"></i> 客户构成';
                            document.querySelector('.metric-item[data-type="customer"]').classList.add('active');
                        } else {
                            chartTitle.innerHTML = '<i class="fas fa-chart-pie"></i> 合同类型';
                            document.querySelector('.metric-item[data-type="contract"]').classList.add('active');
                        }
						    // 更新数据标签
    const labelsContainer = document.getElementById('chart-data-labels');
    labelsContainer.innerHTML = '';
    
    if (type === 'vehicle') {
        const vehicleData = [
            { name: '经租', value: 230, color: '#40E0D0' },
            { name: '融租', value: 490, color: '#00FFFF' },
            { name: '挂靠', value: 75, color: '#9370DB' },
            { name: '库存', value: 28, color: '#FFA500' }
        ];
        
        vehicleData.forEach(item => {
            const label = document.createElement('span');
            label.className = 'data-label';
            label.innerHTML = `${item.name} <strong>${item.value}</strong>`;
            label.style.borderColor = item.color;
            labelsContainer.appendChild(label);
        });
        
    } else if (type === 'contract') {
        const contractData = [
            { name: '经租', value: 230, color: '#40E0D0' },
            { name: '融租', value: 490, color: '#00FFFF' },
            { name: '服务', value: 36, color: '#9370DB' }
        ];
        
        contractData.forEach(item => {
            const label = document.createElement('span');
            label.className = 'data-label';
            label.innerHTML = `${item.name} <strong>${item.value}</strong>`;
            label.style.borderColor = item.color;
            labelsContainer.appendChild(label);
        });
        
    } else if (type === 'customer') {
        const customerData = [
            { name: '营运中', value: 820, color: '#00CED1' },
            { name: '非营运', value: 46, color: '#FFA500' }
        ];
        
        customerData.forEach(item => {
            const label = document.createElement('span');
            label.className = 'data-label';
            label.innerHTML = `${item.name} <strong>${item.value}</strong>`;
            label.style.borderColor = item.color;
            labelsContainer.appendChild(label);
        });
    }
                        const option = getPie3D(pieData, 0.6, distance, 35, pieHeight, 1);
                        myChart.setOption(option, true);
                    } catch (error) {
                        console.error('Error updating chart:', error);
                    }
                };
                const defaultType = 'contract';
                const chartTitle = document.getElementById('chart-title');
                chartTitle.innerHTML = '<i class="fas fa-chart-pie"></i> 合同类型';
                const pieData = getChartData(defaultType);
                const { distance, pieHeight } = adjustParamsByWindowSize();
                const option = getPie3D(pieData, 0.6, distance, 35, pieHeight, 1);
                myChart.setOption(option, true);
                const handleResize = () => {
                    if (myChart) {
                        myChart.resize();
                        const currentType = document.querySelector('.metric-item.active')?.getAttribute('data-type') || defaultType;
                        updateChart(currentType);
                    }
                };
                const debounce = (func, wait) => {
                    let timeout;
                    return function() {
                        const context = this;
                        const args = arguments;
                        clearTimeout(timeout);
                        timeout = setTimeout(() => {
                            func.apply(context, args);
                        }, wait);
                    };
                };
                window.addEventListener('resize', debounce(handleResize, 200));
                body.addEventListener('transitionend', () => {
                    try {
                        const option = myChart.getOption();
                        option.legend[0].textStyle.color = body.classList.contains('light-theme') ? '#1a2a44' : '#e6f0fa';
                        myChart.setOption(option);
                    } catch (error) {
                        console.error('Error updating chart theme:', error);
                    }
                });
            };
            initChart();
        });
		if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(registration => {
          console.log('Service Worker 注册成功，作用域: ', registration.scope);
        })
        .catch(error => {
          console.log('Service Worker 注册失败: ', error);
        });
    });
  }
